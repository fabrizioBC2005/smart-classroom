name: smart-classroom

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sc-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  db:
    image: postgres:16-alpine
    container_name: sc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smartclassroom}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sc} -d ${POSTGRES_DB:-smartclassroom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sc-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: sc-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: sc-worker
    restart: unless-stopped
    command: python -m worker.main
    env_file: .env
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  simulator:
    build: ./simulator
    container_name: sc-simulator
    restart: unless-stopped
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_started
      api:
        condition: service_started
    profiles: ["sim"]

  web:
    profiles: ["docker-web"]
    build: ./web
    container_name: sc-web
    restart: unless-stopped
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pg_data:
  mosquitto_data:
  mosquitto_log:
