# Mosquitto — configuracion de desarrollo para Smart Classroom
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT nativo: aqui se conecta el ESP32
listener 1883 0.0.0.0
protocol mqtt

# MQTT sobre WebSocket: util para depurar desde el navegador (MQTT Explorer)
listener 9001 0.0.0.0
protocol websockets

# En desarrollo permitimos conexion anonima.
# EN PRODUCCION: poner allow_anonymous false y montar password_file.
allow_anonymous true
# password_file /mosquitto/config/passwd

max_queued_messages 2000
message_size_limit 8192
